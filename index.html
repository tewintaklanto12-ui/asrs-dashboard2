<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ASRS Dashboard</title>

https://cdn.jsdelivr.net/npm/chart.js
<script cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f7fb;
padding:20px;
}

.header{
background:linear-gradient(135deg,#0F4C81,#1976D2,#42A5F5);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
}

.toolbar{
display:flex;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
}

input,select{
padding:12px;
border-radius:10px;
border:1px solid #ccc;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:20px;
}

.card{
padding:20px;
border-radius:15px;
color:white;
}

.blue{background:#1565C0;}
.cyan{background:#00BCD4;}
.green{background:#00C853;}
.orange{background:#FB8C00;}

.card h1{
font-size:42px;
margin-top:10px;
}

.chart-box{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1565C0;
color:white;
padding:10px;
}

td{
padding:8px;
border-bottom:1px solid #eee;
}

</style>

</head>

<body>

<div class="header">
<h1>ASRS DAY-NIGHT PERFORMANCE DASHBOARD</h1>
<p>CJ CDC Thailand | Warehouse Operations Monitoring</p>
</div>

<div class="toolbar">

<input
type="file"
id="excelUpload"
accept=".xlsx,.xls">

<select id="workType">
<option value="All">All Work Type</option>
<option value="Storage">Storage</option>
<option value="Full Retrieval (Main out)">
Full Retrieval (Main out)
</option>
</select>

</div>

<div class="cards">

<div class="card blue">
<h3>Total Pallet</h3>
<h1 id="totalPallet">0</h1>
</div>

<div class="card cyan">
<h3>Total Result Qty</h3>
<h1 id="totalQty">0</h1>
</div>

<div class="card green">
<h3>Storage Count</h3>
<h1 id="storageCount">0</h1>
</div>

<div class="card orange">
<h3>Retrieval Count</h3>
<h1 id="retrievalCount">0</h1>
</div>

</div>

<div class="chart-box">

<h3 style="margin-bottom:15px;">
Hourly Activity
</h3>

<canvas id="hourChart"></canvas>

</div>

<div class="chart-box">

<h3 style="margin-bottom:15px;">
Transaction Detail
</h3>

<table>

<thead>
<tr>
<th>Date Time</th>
<th>Work Type</th>
<th>Pallet ID</th>
<th>Result Qty</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>

</table>

</div>

<script>

let rawData=[];
let chart;

document
.getElementById("excelUpload")
.addEventListener("change",loadExcel);

document
.getElementById("workType")
.addEventListener("change",applyFilter);

function loadExcel(e){

const file=e.target.files[0];

const reader=new FileReader();

reader.onload=function(evt){

const workbook=
XLSX.read(
evt.target.result,
{
type:"binary"
}
);

const sheet=
workbook.Sheets[
workbook.SheetNames[0]
];

rawData=
XLSX.utils.sheet_to_json(sheet);

applyFilter();

};

reader.readAsBinaryString(file);

}

function applyFilter(){

let data=[...rawData];

const filter=
document.getElementById("workType").value;

if(filter!=="All"){

data=
data.filter(
x=>String(
x["Work Type"]
).trim()===filter
);

}

buildDashboard(data);

}

function buildDashboard(data){

let totalQty=0;
let storage=0;
let retrieval=0;

const hourMap={};

data.forEach(row=>{

let qty=
Number(
row["Result Qty"]
)||0;

totalQty+=qty;

if(
row["Work Type"]==="Storage"
){
storage++;
}

if(
String(
row["Work Type"]
).includes(
"Full Retrieval"
)
){
retrieval++;
}

const datetime=
String(
row["Registration Date/Time"]||""
);

const time=
datetime.split(" ")[1];

if(time){

const hour=
parseInt(
time.split(":")[0]
);

hourMap[hour]=
(hourMap[hour]||0)+qty;

}

});

document.getElementById(
"totalPallet"
).innerText=data.length;

document.getElementById(
"totalQty"
).innerText=
totalQty.toLocaleString();

document.getElementById(
"storageCount"
).innerText=storage;

document.getElementById(
"retrievalCount"
).innerText=retrieval;

const labels=
Object.keys(hourMap).sort((a,b)=>a-b);

const values=
labels.map(
x=>hourMap[x]
);

if(chart){
chart.destroy();
}

chart=
new Chart(
document.getElementById(
"hourChart"
),
{
type:"bar",
data:{
labels:labels,
datasets:[{
label:"Result Qty",
data:values,
backgroundColor:"#42A5F5"
}]
}
});

const tbody=
document.getElementById(
"tableBody"
);

tbody.innerHTML="";

data.slice(0,50)
.forEach(row=>{

tbody.innerHTML+=`
<tr>
<td>${row["Registration Date/Time"]||""}</td>
<td>${row["Work Type"]||""}</td>
<td>${row["Pallet ID"]||""}</td>
<td>${row["Result Qty"]||0}</td>
</tr>
`;

});

}

</script>

</body>
</html>
