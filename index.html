<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASRS Dashboard</title>

<script src="sdelivr.net/npm/chart.js

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#F4F7FB;
padding:20px;
}

.header{
background:linear-gradient(
135deg,
#0F4C81,
#1976D2,
#42A5F5
);
color:white;
padding:30px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.header h1{
font-size:32px;
}

.header p{
margin-top:5px;
opacity:.9;
}

.toolbar{
display:flex;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
}

input,
select{
padding:12px;
border-radius:10px;
border:1px solid #DCE7F5;
background:white;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:20px;
}

.card{
color:white;
padding:24px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h3{
font-size:15px;
}

.card h1{
font-size:40px;
margin-top:10px;
}

.blue{
background:#1565C0;
}

.cyan{
background:#00BCD4;
}

.green{
background:#00C853;
}

.orange{
background:#FB8C00;
}

.chart-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
margin-bottom:20px;
}

.chart-box{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.chart-box h3{
margin-bottom:15px;
color:#1565C0;
}

.table-box{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#1565C0;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#F8FBFF;
}

@media(max-width:900px){

.cards{
grid-template-columns:repeat(2,1fr);
}

.chart-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">
<h1>ASRS DAY-NIGHT PERFORMANCE DASHBOARD</h1>
<p>CJ CDC Thailand | Warehouse Operations Monitoring</p>
</div>

<div class="toolbar">

<input type="file">

<select>
<option>All Work Type</option>
<option>Storage</option>
<option>Full Retrieval (Main out)</option>
</select>

<option
