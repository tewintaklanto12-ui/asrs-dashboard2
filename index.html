<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASRS Dashboard</title>

https://cdn.jsdelivr.net/npm/chart.js

<style>
body{
    font-family:Segoe UI,sans-serif;
    background:#f4f7fb;
    padding:20px;
}

h1{
    color:#1565C0;
}

.card{
    padding:20px;
    border-radius:15px;
    background:#1565C0;
    color:white;
    margin-bottom:20px;
}
</style>

</head>

<body>

<h1>ASRS Dashboard</h1>

<div class="card">
    Chart.js Test
</div>

<canvas id="myChart"></canvas>

<script>

new Chart(
document.getElementById('myChart'),
{
    type:'bar',
    data:{
        labels:['20','21','22','23'],
        datasets:[{
            label:'Test',
            data:[10,20,15,25],
            backgroundColor:'#42A5F5'
        }]
    }
}
);

</script>

</body>
</html>
